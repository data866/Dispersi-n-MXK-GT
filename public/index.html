<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispersión MXK GT</title>
  <style>
    :root{--blue:#073b9a;--sky:#3c82ef;--ink:#17223b;--muted:#61708a;--paper:#fff;--bg:#eef3fb;--line:#dce5f3;--green:#159867;--red:#df4b54;--amber:#d98715}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
    header{background:var(--paper);border-bottom:1px solid var(--line);padding:16px max(22px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;color:var(--blue)}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f3db22 0 35%,#0753b4 36%);transform:rotate(45deg)}.status{font-size:12px;color:var(--muted);text-align:right}.status b{display:block;color:var(--green);font-size:13px}
    main{max-width:1260px;margin:24px auto;padding:0 18px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px}.hero h1{margin:0;color:var(--blue);font-size:31px}.hero p{color:var(--muted);margin:7px 0 18px}.tabs{display:flex;gap:7px;overflow:auto;margin:20px 0}.tabs button{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:9px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .filters{background:#fff;border:1px solid var(--line);padding:13px;border-radius:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filters label{font-size:12px;color:var(--muted);font-weight:700}.filters select,.filters input{border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;color:var(--ink)}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(135px,1fr));gap:13px;margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 3px 12px #0d347007}.card small{color:var(--muted);font-weight:700}.card strong{display:block;font-size:26px;margin-top:9px}.card.green strong{color:var(--green)}.card.red strong{color:var(--red)}.card.amber strong{color:var(--amber)}
    .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin:16px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;overflow:auto}.panel h2{font-size:16px;margin:0 0 14px;color:var(--blue)}.chart{height:250px;display:flex;gap:4px;align-items:end;border-bottom:1px solid var(--line);padding:0 2px}.bar{flex:1;min-width:8px;background:linear-gradient(#5394ff,#1553b5);border-radius:5px 5px 0 0;position:relative;cursor:default}.bar:hover::after{content:attr(data-label);position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#17223b;color:#fff;padding:5px 7px;border-radius:5px;font-size:11px;white-space:nowrap;z-index:2}.legend{display:flex;gap:15px;color:var(--muted);font-size:12px;margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--sky)}
    table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#fff;background:var(--sky);padding:9px;position:sticky;top:0}td{padding:9px;border-bottom:1px solid var(--line)}tr:hover td{background:#f8fbff}.right{text-align:right}.badge{border-radius:99px;padding:3px 7px;font-size:11px;font-weight:700}.approved{background:#e1f8ef;color:#087a51}.rejected{background:#ffe8ea;color:#bc2630}.unfinished{background:#fff2dd;color:#a75d00}.empty{padding:30px;color:var(--muted);text-align:center}.dispersal{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.metric{padding:13px;background:#f4f8ff;border-radius:9px}.metric strong{font-size:22px;color:var(--blue);display:block;margin-top:5px}
    @media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{display:block}.dispersal{grid-template-columns:1fr}.status{text-align:left;margin-top:10px}}@media(max-width:460px){.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="brand"><i class="mark"></i>Maxikash · Guatemala</div><div class="status" id="status">Cargando datos…</div></header>
  <main>
    <section class="hero"><div><h1 id="heading">Solicitudes únicas</h1><p id="subtitle">Migración independiente de Dispersión MXK GT</p></div></section>
    <nav class="tabs" id="tabs"></nav>
    <section class="filters"><label>Desde <input id="from" type="date"></label><label>Hasta <input id="to" type="date"></label><label>Distribuidor <select id="distributor"><option value="">Todos</option></select></label></section>
    <section id="view"></section>
  </main>
  <script>
  const money=n=>new Intl.NumberFormat('es-GT',{style:'currency',currency:'GTQ',maximumFractionDigits:0}).format(n||0);
  const integer=n=>new Intl.NumberFormat('es-GT').format(n||0);
  const pct=(a,b)=>b?`${(a*100/b).toFixed(1)}%`:'—';
  const tabs=[['requests','Solicitudes'],['dispersals','Dispersión y Activación'],['inventory','Inventario'],['detail','Detalle de ofertas']]; let data,active='requests';
  const $=id=>document.getElementById(id); const state=()=>({from:$('from').value,to:$('to').value,dist:$('distributor').value});
  function match(row,s){return (!s.from||row.date>=s.from)&&(!s.to||row.date<=s.to)&&(!s.dist||row.distributor===s.dist)}
  function card(label,value,klass=''){return `<article class="card ${klass}"><small>${label}</small><strong>${value}</strong></article>`}
  function chart(rows,key,label){let max=Math.max(...rows.map(x=>x[key]||0),1);return `<div class="chart">${rows.map(r=>`<i class="bar" style="height:${Math.max(2,(r[key]||0)/max*100)}%" data-label="${r.date}: ${label} ${integer(r[key])}"></i>`).join('')}</div>`}
  function table(rows,cols){if(!rows.length)return '<div class="empty">No hay datos con esos filtros.</div>';return `<table><thead><tr>${cols.map(c=>`<th class="${c.right?'right':''}">${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.right?'right':''}">${c.value(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  function requests(){let s=state(), rows=data.requests.filter(x=>match(x,s)), a=rows.filter(x=>x.status==='APROBADO').length,r=rows.filter(x=>x.status==='RECHAZADO').length,u=rows.length-a-r;let byDate={};rows.forEach(x=>{let d=byDate[x.date]??={date:x.date,total:0,approved:0,rejected:0,unfinished:0};d.total++;x.status==='APROBADO'?d.approved++:x.status==='RECHAZADO'?d.rejected++:d.unfinished++});let dates=Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));let byDist=aggregate(rows,'distributor');return `<div class="cards">${card('Total solicitudes',integer(rows.length))}${card('Total aprobadas',integer(a),'green')}${card('Total rechazos',integer(r),'red')}${card('No terminó proceso',integer(u),'amber')}${card('% aprobado',pct(a,rows.length),'green')}</div><div class="grid"><article class="panel"><h2>Solicitudes únicas del mes</h2>${chart(dates,'total','solicitudes')}<div class="legend"><span><i class="dot"></i>Pasa el cursor sobre cada día</span></div></article><article class="panel"><h2>Por distribuidor</h2>${table(byDist.slice(0,9),[{label:'Distribuidor',value:x=>x.name},{label:'Total',right:1,value:x=>integer(x.total)},{label:'Aprobado',right:1,value:x=>integer(x.approved)}])}</article></div><article class="panel"><h2>Solicitudes por día</h2>${table(dates,[{label:'Fecha',value:x=>x.date},{label:'Total',right:1,value:x=>integer(x.total)},{label:'Aprobado',right:1,value:x=>integer(x.approved)},{label:'Rechazado',right:1,value:x=>integer(x.rejected)},{label:'Sin proceso',right:1,value:x=>integer(x.unfinished)},{label:'% aprobado',right:1,value:x=>pct(x.approved,x.total)}])}</article>`}
  function aggregate(rows,key){let o={};for(let x of rows){let v=x[key]||'Sin dato',z=o[v]??={name:v,total:0,approved:0,rejected:0,unfinished:0};z.total++;x.status==='APROBADO'?z.approved++:x.status==='RECHAZADO'?z.rejected++:z.unfinished++}return Object.values(o).sort((a,b)=>b.total-a.total)}
  function dispersals(){let s=state(), ds=data.dispersions.filter(x=>(!s.from||x.date>=s.from)&&(!s.to||x.date<=s.to)),cr=ds.reduce((n,x)=>n+x.credits,0),amount=ds.reduce((n,x)=>n+x.amount,0),key=(s.to||new Date().toISOString()).slice(0,7),target=data.monthlyTargets[key]||0;return `<div class="cards">${card('Total motos',integer(cr),'green')}${card('Meta mensual',target?money(target):'Pendiente')}${card('Venta total',money(amount),'green')}${card('% vs meta',target?pct(amount,target):'—','green')}${card('Ticket promedio',cr?money(amount/cr):'—')}</div><div class="grid"><article class="panel"><h2>Dispersión diaria</h2>${chart(ds,'amount','Q') }<div class="legend"><span><i class="dot"></i>Monto dispersado por día</span></div></article><article class="panel"><h2>Resumen del periodo</h2><div class="dispersal"><div class="metric"><small>Créditos</small><strong>${integer(cr)}</strong></div><div class="metric"><small>Monto</small><strong>${money(amount)}</strong></div><div class="metric"><small>Meta</small><strong>${target?money(target):'—'}</strong></div></div></article></div><article class="panel"><h2>Detalle diario</h2>${table(ds,[{label:'Fecha',value:x=>x.date},{label:'Créditos',right:1,value:x=>integer(x.credits)},{label:'Total dispersado',right:1,value:x=>money(x.amount)},{label:'Meta mensual',right:1,value:()=>target?money(target):'—'},{label:'% vs meta',right:1,value:x=>target?pct(x.amount,target):'—'}])}</article>`}
  function inventory(){let s=state(),rows=data.offers.filter(x=>match(x,s)),counts={};rows.forEach(x=>counts[x.stage]=(counts[x.stage]||0)+1);let values=Object.entries(counts).map(([stage,total])=>({stage,total})).sort((a,b)=>b.total-a.total);return `<div class="cards">${card('Ofertas en periodo',integer(rows.length))}${card('Dispersadas',integer(rows.filter(x=>x.dispersedAt).length),'green')}${card('Por dispersar',integer(rows.filter(x=>!x.dispersedAt).length),'amber')}${card('Etapas activas',integer(values.length))}${card('Monto pendiente',money(rows.filter(x=>!x.dispersedAt).reduce((n,x)=>n+x.amount,0)),'amber')}</div><div class="grid"><article class="panel"><h2>Inventario por etapa</h2>${chart(values.map((x,i)=>({date:x.stage,total:x.total})).slice(0,20),'total','ofertas')}</article><article class="panel"><h2>Etapas</h2>${table(values,[{label:'Etapa',value:x=>x.stage},{label:'Ofertas',right:1,value:x=>integer(x.total)}])}</article></div>`}
  function detail(){let s=state(),rows=data.offers.filter(x=>match(x,s)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<article class="panel"><h2>Detalle de ofertas</h2>${table(rows,[{label:'Fecha',value:x=>x.date||'—'},{label:'ID oferta',value:x=>x.id},{label:'Etapa',value:x=>x.stage},{label:'Distribuidor',value:x=>x.distributor},{label:'Sucursal',value:x=>x.branch},{label:'Marca / modelo',value:x=>`${x.brand} ${x.model}`},{label:'Monto',right:1,value:x=>money(x.amount)},{label:'Dispersión',value:x=>x.dispersedAt||'—'}])}</article>`}
  function render(){let item=tabs.find(x=>x[0]===active);$('heading').textContent=item[1];$('tabs').innerHTML=tabs.map(([id,label])=>`<button class="${id===active?'active':''}" data-tab="${id}">${label}</button>`).join('');$('tabs').querySelectorAll('button').forEach(x=>x.onclick=()=>{active=x.dataset.tab;render()});$('view').innerHTML=({requests,dispersals,inventory,detail})[active]()}
  fetch('/data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(json=>{data=json;let all=[...new Set(data.requests.map(x=>x.distributor).concat(data.offers.map(x=>x.distributor)))].sort();$('distributor').innerHTML+=[...all].map(x=>`<option>${x}</option>`).join('');let dates=[...data.requests.map(x=>x.date),...data.offers.map(x=>x.date)].filter(Boolean).sort();$('from').value=dates[0]||'';$('to').value=dates.at(-1)||'';$('from').min=$('to').min=dates[0]||'';$('from').max=$('to').max=dates.at(-1)||'';$('status').innerHTML=`<b>● Datos actualizados</b>${new Date(data.updatedAt).toLocaleString('es-GT')}`;['from','to','distributor'].forEach(id=>$(id).onchange=render);render()}).catch(()=>{$('view').innerHTML='<div class="panel empty">Aún no se han generado datos. Ejecuta la actualización local.</div>'; $('status').textContent='Pendiente de primera actualización';});
  </script>
</body></html>
