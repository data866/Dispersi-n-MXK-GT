<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispersión MXK GT</title>
  <style>
    :root{--blue:#4285f4;--title:#000099;--text:#666;--line:#e7e7e7}*{box-sizing:border-box}
    body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:var(--text)}
    .sheet{max-width:1450px;margin:0 auto;background:#fff;min-height:100vh;padding:26px 4vw 42px;box-shadow:0 0 7px #bbb}
    .mast{height:112px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:start}.brand{font-size:38px;font-weight:700;color:#0752be;letter-spacing:-2px}.brand span{display:inline-block;border:7px solid #0752be;width:31px;height:31px;transform:rotate(45deg);margin-right:12px;vertical-align:9px}.title{font-size:44px;font-weight:700;color:var(--title);text-align:center;margin:0}.flag{justify-self:end;font-size:52px}
    .tabs{display:flex;justify-content:center;gap:28px;border-bottom:1px solid #eee;margin:2px -4vw 26px;padding:0 12px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 3px 12px;color:#334f88;font-size:14px;cursor:pointer}.tabs button.active{color:#0a45bb;border-bottom-color:#0a45bb;font-weight:700}
    .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;margin:12px 8% 38px}.card{text-align:center}.card h2{font-size:22px;margin:0 0 9px;color:#555}.card div{background:#fafafa;border-radius:5px;padding:13px 8px;font-size:34px;color:#666;box-shadow:0 2px 5px #aaa}
    .cards.four{grid-template-columns:repeat(4,1fr);margin-left:0;margin-right:0}.cards.four .card div{color:#1265c5}.cards.four .card h2{color:#111}
    .caption{font-size:14px;font-weight:700;color:#000099;text-align:center;margin:16px 0 10px}.wrap{overflow:auto;margin:0 1% 27px;border-radius:4px;box-shadow:0 1px 3px #888}.wide{min-width:900px}
    table{border-collapse:separate;border-spacing:0;width:100%;font-size:16px;color:#666}th{background:var(--blue);padding:9px 11px;color:white;text-align:left;font-weight:700;white-space:nowrap}td{padding:9px 11px;border-top:5px solid #eee;white-space:nowrap}td.num,th.num{text-align:right}.total td{font-weight:700}.pivot th:first-child,.pivot td:first-child{min-width:200px;text-align:center}.pivot tbody td:first-child{background:var(--blue);color:#fff;font-weight:700}.pivot tbody tr:last-child td:first-child{background:#fff;color:#666}.head2 th{background:#fff;color:#666;border-top:0;text-align:center;font-weight:400}.head2 th:first-child{text-align:left}.empty{text-align:center;padding:28px;color:#777}
    .report-title{font-size:42px;color:var(--title);font-weight:700;text-align:center;margin:0 0 38px}.detail .wrap{box-shadow:none;border-radius:0}.detail table{min-width:1250px}.detail th,.detail td{padding:8px 10px}.detail td{border-top:5px solid #eee}
    @media(max-width:800px){.sheet{padding:18px}.mast{height:auto;grid-template-columns:1fr;gap:10px}.title{text-align:left;font-size:32px}.flag{display:none}.brand{font-size:28px}.cards,.cards.four{grid-template-columns:repeat(2,1fr);margin:10px 0 25px;gap:12px}.card h2{font-size:16px}.card div{font-size:25px}.tabs{margin-left:-18px;margin-right:-18px;gap:14px;overflow:auto;justify-content:flex-start}.tabs button{white-space:nowrap}}
  </style>
</head>
<body><main class="sheet">
  <header class="mast"><div class="brand"><span></span>Maxikash</div><h1 class="title" id="heading">Solicitudes Únicas Totales</h1><div class="flag">🇬🇹</div></header>
  <nav class="tabs" id="tabs"></nav><section id="view"></section>
</main>
<script>
const nf=new Intl.NumberFormat('es-GT'); const money=n=>nf.format(Math.round(Number(n)||0));
const pct=(a,b)=>b?`${(a*100/b).toFixed(1).replace('.',',')}%`:'0,0%';
const monthName=d=>new Date(`${d}T12:00:00`).toLocaleDateString('es-GT',{day:'numeric',month:'short',year:'numeric'}).replace('.','');
const tabs=[['requests','Solicitudes'],['dispersals','Dispersion y Activacion'],['inventory','Inventario'],['detail','Página sin título']];let data,active='requests';
const bucket=r=>r.buro==='APROBADO'?'approved':r.buro==='RECHAZADO'?'rejected':'unfinished';
const sum=(rows,key)=>rows.reduce((n,r)=>n+(Number(r[key])||0),0);
function card(label,value){return `<article class="card"><h2>${label}</h2><div>${value}</div></article>`}
function rawTable(rows,cols,klass=''){if(!rows.length)return '<div class="empty">No hay datos.</div>';return `<div class="wrap ${klass}"><table><thead><tr>${cols.map(c=>`<th class="${c.r?'num':''}">${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr>${cols.map(c=>`<td class="${c.r?'num':''}">${c.v(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function group(rows,key){let out={};for(const r of rows){let k=r[key]||'Sin dato',x=out[k]??={name:k,total:0,approved:0,rejected:0,unfinished:0};x.total++;x[bucket(r)]++}return Object.values(out).sort((a,b)=>b.total-a.total)}
function summaryTable(rows,label){return rawTable(rows,[{l:label,v:x=>x.name},{l:'APROBADO',r:1,v:x=>nf.format(x.approved)},{l:'NO TERMINO PROCESO',r:1,v:x=>nf.format(x.unfinished)},{l:'RECHAZADO',r:1,v:x=>nf.format(x.rejected)},{l:'Total',r:1,v:x=>nf.format(x.total)}])}
function requestPivot(rows){let latest=rows.map(x=>x.date).sort().at(-1)||'',month=latest.slice(0,7),days=rows.filter(x=>x.date.startsWith(month));let by={};for(const r of days){let x=by[r.date]??={total:0,approved:0,rejected:0,unfinished:0};x.total++;x[bucket(r)]++}let dates=Object.keys(by).sort();let metrics=[['# Total','total'],['# No termino proceso','unfinished'],['# No Aprobado','rejected'],['#Aprobado','approved'],['% Aprobado','pct']];return `<div class="caption">Solicitudes unicas del mes</div><div class="wrap wide"><table class="pivot"><thead><tr><th colspan="${dates.length+1}">fecha_solicitud</th></tr><tr class="head2"><th></th>${dates.map(d=>`<th>${monthName(d)}</th>`).join('')}</tr></thead><tbody>${metrics.map(([name,key])=>`<tr><td>${name}</td>${dates.map(d=>{let x=by[d];return `<td class="num">${key==='pct'?pct(x.approved,x.total):nf.format(x[key])}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function requests(){let r=data.requests||[],a=r.filter(x=>x.buro==='APROBADO').length,re=r.filter(x=>x.buro==='RECHAZADO').length,u=r.length-a-re;let week=group(r.map(x=>({...x,week:x.week||isoWeek(x.date)})),'week');return `<section class="cards">${card('Total Solicitudes',nf.format(r.length))}${card('Total Aprobadas',nf.format(a))}${card('Total Rechazos',nf.format(re))}${card('No termino proceso',nf.format(u))}${card('% Aprobado',pct(a,r.length))}</section>${requestPivot(r)}<div class="caption">Solicitudes únicas por semana</div>${summaryTable(week,'yw')}<div class="caption">Solicitudes únicas por Distribuidor</div>${summaryTable(group(r,'distributor'),'distribuidor')}<div class="caption">Solicitudes únicas por sucursal</div>${summaryTable(group(r,'branch'),'sucursal')}<div class="caption">Solicitudes únicas por usuario</div>${summaryTable(group(r,'user'),'usuario')}`}
function isoWeek(d){let x=new Date(`${d}T12:00:00`);x.setDate(x.getDate()+4-(x.getDay()||7));let y=new Date(x.getFullYear(),0,1);return `${x.getFullYear()}${String(Math.ceil((((x-y)/86400000)+1)/7)).padStart(2,'0')}`}
function dispersals(){let ds=data.dispersions||[],last=ds.map(x=>x.date).sort().at(-1)||'',month=last.slice(0,7),rows=ds.filter(x=>x.date.startsWith(month)),credit=sum(rows,'credits'),amount=sum(rows,'amount'),target=(data.monthlyTargets||{})[month]||0;return `<section class="cards four">${card('Venta Total',money(amount))}${card('Total Motos',nf.format(credit))}${card('Meta',money(target))}${card('Proyección',money(amount))}</section><div class="wrap wide"><table><thead><tr><th>dia_mes</th><th class="num"># Total creditos</th><th class="num">Q Total Dispersado</th><th class="num">Q Meta</th><th class="num">% vs Meta</th><th class="num">Factor</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${Number(x.date.slice(-2))}</td><td class="num">${nf.format(x.credits)}</td><td class="num">${money(x.amount)}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>`).join('')}</tbody></table></div>`}
function inventory(){let r=data.requests||[],weeks={};for(const x of r){let w=x.week||isoWeek(x.date),z=weeks[w]??={week:w,total:0,follow:{}};z.total++;let f=x.followup||'Sin seguimiento';z.follow[f]=(z.follow[f]||0)+1}let rows=Object.values(weeks).sort((a,b)=>String(b.week).localeCompare(String(a.week))),headers=['3 No confirma NIP','4 Sin Respuesta Buro','5 Rechazado','6 No selecciona Oferta','7 Completo'];return `<h1 class="report-title">Inventario Solicitudes</h1><div class="wrap wide"><table><thead><tr><th colspan="${headers.length+2}" class="num">seguimiento / cantidad</th></tr><tr class="head2"><th>num_semana</th>${headers.map(h=>`<th class="num">${h}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${String(x.week).slice(-2)}</td>${headers.map(h=>`<td class="num">${x.follow[h]||'—'}</td>`).join('')}<td class="num"><b>${nf.format(x.total)}</b></td></tr>`).join('')}<tr class="total"><td>Total</td>${headers.map(h=>`<td class="num">${nf.format(rows.reduce((n,x)=>n+(x.follow[h]||0),0))}</td>`).join('')}<td class="num">${nf.format(r.length)}</td></tr></tbody></table></div>`}
function detail(){let r=(data.requests||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))),o=data.offers||[];return `<section class="detail">${rawTable(r,[{l:'idOferta',v:x=>x.offerId??'null'},{l:'sucursal',v:x=>x.branch},{l:'distribuidor',v:x=>x.distributor},{l:'fecha_solicitud',v:x=>x.date},{l:'seguimiento',v:x=>x.followup||'—'},{l:'usuario',v:x=>x.user||'—'},{l:'pk_usuario',v:()=>''},{l:'solicitud',v:x=>x.id??''},{l:'doc_ident',v:x=>x.doc||''},{l:'cliente',v:x=>x.client||''},{l:'Record Count',r:1,v:()=>1}],'detail')}${rawTable(o,[{l:'idFlujo',v:x=>x.id||''},{l:'id_oferta',v:x=>x.id||''},{l:'fecha_activacion',v:x=>x.dispersedAt||'null'},{l:'etapa',v:x=>x.stage},{l:'modelo_moto',v:x=>x.model},{l:'marca_moto',v:x=>x.brand},{l:'distribuidor',v:x=>x.distributor},{l:'sucursal',v:x=>x.branch},{l:'monto_financiar',r:1,v:x=>money(x.amount)}],'detail')}</section>`}
function render(){let tab=tabs.find(t=>t[0]===active);document.getElementById('heading').textContent=active==='requests'?'Solicitudes Únicas Totales':active==='inventory'?'':tab[1];document.getElementById('tabs').innerHTML=tabs.map(([id,l])=>`<button class="${id===active?'active':''}" data-id="${id}">${l}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()});document.getElementById('view').innerHTML=({requests,dispersals,inventory,detail})[active]()}
fetch('/data.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>document.getElementById('view').innerHTML='<div class="empty">No fue posible cargar los datos.</div>');
</script></body></html>
