<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXIKASH Guatemala · Demo del portal</title><style>
:root{--blue:#0047bb;--nav:#06388e;--ink:#132d53;--muted:#6d7e96;--lime:#d2d755;--bg:#f1f5fb;--line:#e2e9f2}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #afbc22;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.45}.demo{padding:10px 20px;background:#f9f7d9;text-align:center;color:#5c601d;font-size:12px;position:relative;z-index:2}.demo b{margin-right:12px}.brand{display:flex;align-items:center;gap:10px;font-size:25px;letter-spacing:-1px;font-weight:800;color:var(--blue)}.brand img{width:155px;height:auto;max-height:44px;object-fit:contain}.login{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1.1fr 1fr}.hero{background:linear-gradient(145deg,#0047bb,#052e79);color:white;padding:9vw 6vw;position:relative;overflow:hidden}.hero:after{content:'';width:440px;height:440px;border:80px solid #ffffff0b;transform:rotate(45deg);position:absolute;right:-240px;bottom:-220px}.hero .eyebrow{color:#e0e781}.hero h1{font-size:clamp(36px,4.4vw,64px);line-height:1.08;letter-spacing:-2px;max-width:620px;margin:28px 0}.hero p{color:#c8d8f2;line-height:1.8;max-width:460px}.hero .chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:40px}.chips span{padding:10px 12px;border:1px solid #ffffff40;border-radius:9px;font-size:12px}.sign{display:flex;align-items:center;justify-content:center;padding:45px}.signbox{max-width:390px;width:100%}.sign h2{font-size:30px;letter-spacing:-1px;margin:45px 0 12px}.sub{color:var(--muted);line-height:1.6}.primary{background:var(--blue);border:0;color:white;padding:13px 18px;border-radius:9px;font-weight:700}.ghost{background:white;border:1px solid var(--line);padding:11px 15px;border-radius:9px;color:var(--ink)}.google{display:flex;gap:16px;align-items:center;justify-content:center;width:100%;margin:28px 0 16px}.google strong{font-size:22px;color:#4285f4}.hint{font-size:12px;color:var(--muted);line-height:1.6}.sign select{width:100%;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:white}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700}.app{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 34px)}aside{background:white;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:22px}aside .brand{padding:5px 10px}nav{display:flex;flex-direction:column;gap:8px;margin-top:12px}nav button{text-align:left;border:0;background:none;border-radius:9px;padding:14px;color:#63738a;display:flex;gap:12px;align-items:center}nav button.on{background:#eaf0fd;color:var(--blue);font-weight:700}nav button.on:before{content:'';height:20px;width:3px;background:var(--blue);border-radius:3px}.sidebottom{margin-top:auto;font-size:12px;color:var(--muted);padding:15px 10px;line-height:1.8}.workspace{min-width:0}header{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;background:#ffffffaa;border-bottom:1px solid var(--line);gap:15px}.breadcrumb{font-size:12px;color:var(--muted)}.account{display:flex;gap:12px;align-items:center}.avatar{background:#e9effb;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:700;color:var(--blue)}.account small{display:block;color:var(--muted);margin-top:4px}main{padding:30px 32px;max-width:1560px;margin:auto}.pagetitle{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:28px;letter-spacing:-.8px;margin:7px 0}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0}.badge{display:inline-block;padding:6px 9px;font-size:11px;border-radius:6px;background:#edf3ff;color:var(--blue)}.badge.green{background:#e9f5ed;color:#237a50}.welcome{background:linear-gradient(120deg,#0047bb,#123e87);border-radius:16px;color:white;padding:28px;display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.welcome p{color:#cfdef6;line-height:1.6;margin-bottom:0}.welcome .eyebrow{color:#e2e88a}.welcome h2{font-size:27px;margin:12px 0}.welcome .stamp{min-width:110px;text-align:right;font-size:12px;color:#dae4f6;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.module{background:white;border:1px solid var(--line);border-radius:14px;padding:23px;display:flex;flex-direction:column;gap:16px}.module .icon{background:#edf3ff;color:var(--blue);width:45px;height:45px;display:grid;place-items:center;border-radius:12px;font-size:23px}.module p{color:var(--muted);line-height:1.6;min-height:44px;margin:0}.module .primary{align-self:flex-start;margin-top:auto}.sectionhead{margin:30px 0 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.metric,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:22px}.metric label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}.metric strong{display:block;font-size:29px;margin:12px 0}.metric small{color:#71839b;font-size:11px}.charts{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel>p{color:var(--muted);font-size:12px}.bars{height:200px;display:flex;align-items:end;gap:18px;padding:20px 10px 0;border-bottom:1px solid var(--line);margin-bottom:28px}.barwrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;position:relative}.bar{width:70%;border-radius:5px 5px 0 0;background:var(--blue);max-width:44px}.barwrap:last-child .bar{background:var(--lime)}.barwrap span{position:absolute;bottom:-23px;font-size:11px;color:var(--muted)}.funnel{padding:20px 0}.funnel div{margin:10px auto;text-align:center;padding:15px;background:#e9f0fc;color:var(--blue);border-radius:6px}.funnel div:nth-child(2){width:75%;background:#c4d5f5}.funnel div:nth-child(3){width:50%;background:var(--blue);color:white}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.toolbar input{flex:1;min-width:180px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:14px 12px;background:#fafbfe}td{padding:16px 12px;border-bottom:1px solid #eff2f7}td b{display:block;margin-bottom:5px}td small{color:var(--muted)}td input{width:17px;height:17px;accent-color:var(--blue)}.panel.table{padding:8px}.notice{border:1px solid #dbe5f5;border-left:3px solid var(--blue);background:#f8faff;padding:15px;border-radius:8px;color:#61738d;font-size:12px;line-height:1.7;margin-top:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#153252;color:white;padding:15px 22px;border-radius:10px;z-index:20;box-shadow:0 10px 30px #0003}.mobiletoggle{display:none}.role-switch{font-size:12px;border:1px solid var(--line);border-radius:7px;background:white;padding:9px;color:var(--blue)}footer{font-size:11px;color:var(--muted);padding:24px 0}.modalback{position:fixed;inset:0;background:#08285877;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:14px;padding:28px;max-width:440px;width:100%}.modal input{width:100%;padding:12px;margin:14px 0;border:1px solid var(--line);border-radius:8px}.modal .actions{display:flex;justify-content:end;gap:10px}.legend{font-size:12px;color:var(--muted);line-height:1.7;margin-top:18px}.empty{padding:35px;color:var(--muted);text-align:center}@media(max-width:1050px){.app{grid-template-columns:195px 1fr}.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.module p{min-height:0}.module{display:grid;grid-template-columns:45px 1fr;gap:12px}.module .icon{grid-row:span 2}.module .primary{grid-column:2}.charts{grid-template-columns:1fr}.account .identity{display:none}}@media(max-width:650px){.login{grid-template-columns:1fr}.hero{padding:35px 25px}.hero h1{font-size:34px;margin:16px 0}.hero .chips{margin-top:20px}.hero p{font-size:13px}.sign{padding:30px 25px}.sign h2{margin-top:12px}.sign .brand{display:none}.app{display:block}aside{display:none;position:fixed;inset:34px 25% 0 0;z-index:9;box-shadow:10px 0 40px #0003}aside.open{display:flex}header{padding:15px 18px}.mobiletoggle{display:block;border:0;background:transparent;font-size:24px;color:var(--blue)}main{padding:23px 18px}.pagetitle{align-items:start;gap:10px}.pagetitle h1{font-size:25px}.pagetitle .badge{display:none}.welcome{padding:22px}.welcome h2{font-size:23px}.welcome .stamp{display:none}.metric{padding:17px}.metric strong{font-size:25px}.metrics{gap:10px}.account{gap:7px}.role-switch{max-width:130px;font-size:11px}.demo{font-size:10px;padding:9px}.demo b{margin-right:3px}.panel{padding:18px}}
</style></head><body><div class="demo"><b>DEMOSTRACIÓN INTERACTIVA</b> Datos ficticios · Acceso Google y permisos simulados · Sin conexión a bases reales</div><div id="root"></div><div id="modal"></div><div id="toast" role="status"></div><script>
'use strict';
const root=document.getElementById('root');let signed=false,role='admin',page='home',filter='',dirty=false;
let users=[{name:'Usuario de ejemplo A',email:'persona.a@example.com',res:true,dist:true,cart:true,download:true},{name:'Usuario de ejemplo B',email:'persona.b@example.com',res:true,dist:true,cart:false,download:false},{name:'Usuario de ejemplo C',email:'persona.c@example.com',res:false,dist:false,cart:true,download:false}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const el=document.getElementById('toast');el.className='toast';el.textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{el.className='';el.textContent=''},4000)}
function brand(){return '<div class="brand"><img src="/logo-maxikash.png" alt="Maxikash"></div>'}
function login(){root.innerHTML=`<div class="login"><section class="hero"><div class="eyebrow">MAXIKASH · GUATEMALA</div><h1>Tu operación.<br>Una sola entrada.</h1><p>Los indicadores, distribuidores y cartera que necesitas, reunidos en un mismo lugar.</p><div class="chips"><span>Resumen General</span><span>Distribuidores</span><span>Cartera Guatemala</span></div></section><section class="sign"><div class="signbox">${brand()}<h2>Bienvenido de nuevo</h2><p class="sub">Accede a tu espacio de trabajo con tu cuenta de Google.</p><button class="ghost google" id="signin"><strong>G</strong> Continuar con Google · demo</button><label class="hint" for="loginRole">Perfil para explorar la demostración</label><select id="loginRole"><option value="admin">Administrador de accesos · vista data</option><option value="user">Usuario de consulta · ejemplo ficticio</option></select><p class="hint">Este botón simula el inicio de sesión. No solicita tu cuenta, contraseña ni permisos de Google.</p><div class="notice">Una sesión para navegar entre los módulos autorizados. En la versión definitiva, cada API comprobará tus permisos.</div></div></section></div>`;document.getElementById('signin').onclick=()=>{role=document.getElementById('loginRole').value;signed=true;page='home';render()}}
const titles={home:'Tu espacio de trabajo',res:'Resumen General',dist:'Distribuidores',cart:'Cartera Guatemala',admin:'Usuarios y permisos'};
function can(p){return role==='admin'?['home','res','dist','admin'].includes(p):['home','res','dist','cart'].includes(p)}
function nav(){return [['home','⌂','Inicio'],['res','▥','Resumen General'],['dist','▦','Distribuidores'],['cart','◫','Cartera Guatemala'],...(role==='admin'?[['admin','⚙','Usuarios y permisos']]:[])].filter(([p])=>can(p)).map(([p,i,t])=>`<button data-page="${p}" class="${page===p?'on':''}" ${page===p?'aria-current="page"':''}><span>${i}</span>${t}</button>`).join('')}
function render(){if(!signed)return login();if(!can(page))page='home';root.innerHTML=`<div class="app"><aside id="sidebar">${brand()}<div class="eyebrow" style="padding:0 10px;color:#8290a6">Portal Guatemala</div><nav aria-label="Navegación principal">${nav()}</nav><div class="sidebottom">Una sesión · tus módulos<br><span class="badge green">Entorno de demostración</span></div></aside><div class="workspace"><header><button class="mobiletoggle" aria-label="Abrir menú" id="menu">☰</button><div class="breadcrumb">Guatemala / ${titles[page]}</div><div class="account"><button class="role-switch" id="switch">${role==='admin'?'Ver como usuario':'Ver como administrador'}</button><div class="avatar">${role==='admin'?'DA':'UE'}</div><div class="identity"><b>${role==='admin'?'Vista de data':'Usuario de ejemplo'}</b><small>${role==='admin'?'Administrador de accesos':'Consulta · sin administración'}</small></div><button class="ghost" id="logout" aria-label="Cerrar sesión de demostración">Salir</button></div></header><main><div class="pagetitle"><div><div class="eyebrow" style="color:#8798ae">🇬🇹 Guatemala · Quetzales</div><h1>${titles[page]}</h1><div class="sub">${page==='admin'?'Control central de los accesos por módulo.':page==='home'?'Todo lo que necesitas para tomar la siguiente decisión.':'Indicadores de ejemplo para explorar la experiencia.'}</div></div><span class="badge">DATOS FICTICIOS</span></div>${page==='home'?home():page==='admin'?admin():dashboard()}<footer>MAXIKASH Guatemala · Propuesta visual del portal centralizado · Ningún cambio afecta usuarios reales</footer></main></div></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('logout').onclick=()=>{signed=false;login()};document.getElementById('switch').onclick=()=>{role=role==='admin'?'user':'admin';page='home';render();toast('Perfil de demostración cambiado')};document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');if(page==='admin')wireAdmin();document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>toast('Descarga simulada: no se exportan datos reales'))}
function go(p){if(!can(p))return toast('Módulo no autorizado en este perfil de ejemplo');page=p;filter='';render();window.scrollTo(0,0)}
function home(){const modules=[['res','▥','Resumen General','Solicitudes, colocación y evolución comercial.','Explorar resumen'],['dist','▦','Distribuidores','Resultados por agencia, distribuidor y departamento.','Ver distribuidores'],['cart','◫','Cartera Guatemala','Comportamiento de cartera, mora y recuperación.','Consultar cartera']];return `<section class="welcome"><div><div class="eyebrow">BIENVENIDO A MAXIKASH</div><h2>Una visión más clara de Guatemala.</h2><p>${role==='admin'?'Administra los accesos desde un solo panel y consulta tus módulos autorizados.':'Tus módulos autorizados, listos para consultar. No tienes acceso a la administración.'}</p></div><div class="stamp">Sesión de ejemplo<br><b>${role==='admin'?'Vista data@maxikash.mx':'persona.demo@example.com'}</b></div></section><div class="sectionhead"><h2>Tus módulos</h2><span class="sub">${modules.filter(x=>can(x[0])).length} disponibles</span></div><div class="cards">${modules.filter(x=>can(x[0])).map(([p,i,t,d,b])=>`<article class="module"><div class="icon">${i}</div><div><h2>${t}</h2><p>${d}</p></div><span class="badge green">Consulta autorizada</span><button class="primary" data-page="${p}">${b} →</button></article>`).join('')}</div>${role==='admin'?'<div class="notice"><b>Administración separada de la consulta.</b> La vista data administra permisos, pero no obtiene acceso automático a Cartera. Esta demostración conserva esa distinción del alcance actual.</div>':'<div class="notice">Perfil ficticio de consulta con tres módulos para mostrar la navegación. No representa ni modifica los permisos de ninguna persona real.</div>'}<div class="sectionhead"><h2>Actividad de ejemplo</h2><span class="badge">Simulada</span></div><div class="panel"><p>Hoy · 09:30 — Indicadores de ejemplo actualizados</p><p>Hoy · 09:00 — Corte de cartera ficticio disponible</p></div>`}
function dashboard(){const cart=page==='cart',dist=page==='dist';const metrics=cart?[['Créditos activos','1,280'],['Saldo capital','Q8,450,000'],['Cartera al corriente','82.4%'],['Recuperación semanal','Q218,500']]:dist?[['Distribuidores','12'],['Consultas','4,260'],['Dispersiones','186'],['Monto financiado','Q1,675,000']]:[['Solicitudes','4,850'],['Aprobadas','1,620'],['% Autorización','33.4%'],['Monto colocado','Q2,180,000']];const labels=cart?['Current','1–7 días','8–14 días','15–30 días']:dist?['Distribuidor Norte','Distribuidor Centro','Distribuidor Sur','Distribuidor Oriente']:['Agencia Central','Agencia Norte','Agencia Sur','Agencia Occidente'];return `<div class="toolbar"><select aria-label="Periodo de ejemplo"><option>Noviembre 2026</option><option>Octubre 2026</option></select><select aria-label="Alcance de ejemplo"><option>Todos los autorizados</option><option>Región de ejemplo</option></select><button class="ghost" onclick="toast('Filtros de demostración aplicados; cifras ilustrativas')">Aplicar filtros</button><button class="ghost" data-export>↓ Descargar · simulado</button></div><div class="metrics">${metrics.map(([l,v])=>`<article class="metric"><label>${l}</label><strong>${v}</strong><small>Cifra ilustrativa · sin fuente real</small></article>`).join('')}</div><div class="charts"><section class="panel"><h3>${cart?'Evolución de recuperación':'Evolución mensual'}</h3><p>${cart?'Monto recuperado · ejemplo':'Consultas y dispersión · ejemplo'}</p><div class="bars" role="img" aria-label="Gráfica ilustrativa de enero a junio">${[38,52,47,72,83,95].map((h,i)=>`<div class="barwrap"><div class="bar" style="height:${h}%"></div><span>${['Ene','Feb','Mar','Abr','May','Jun'][i]}</span></div>`).join('')}</div></section><section class="panel"><h3>${cart?'Distribución de cartera':'Embudo comercial'}</h3><p>Valores de demostración</p><div class="funnel"><div>${cart?'82% · Al corriente':'4,850 · Consultas'}</div><div>${cart?'12% · Mora temprana':'1,620 · Aprobadas'}</div><div>${cart?'6% · Mora mayor':'240 · Dispersadas'}</div></div></section></div><div class="sectionhead"><h2>${cart?'Buckets de cartera':dist?'Resultados por distribuidor':'Resultados por agencia'}</h2><span class="sub">Ejemplo</span></div><section class="panel table"><div class="tablewrap"><table><thead><tr><th>${cart?'Bucket':'Nombre ficticio'}</th><th>${cart?'Créditos':'Consultas'}</th><th>${cart?'Saldo capital':'Dispersiones'}</th><th>${cart?'Participación':'Monto financiado'}</th></tr></thead><tbody>${labels.map((l,i)=>`<tr><td><b>${l}</b></td><td>${[420,280,190,130][i]}</td><td>${cart?'Q'+[2800000,1600000,940000,720000][i].toLocaleString('en-US'):[54,38,27,19][i]}</td><td>${cart?[42,28,19,11][i]+'%':'Q'+[480000,342000,243000,171000][i].toLocaleString('en-US')}</td></tr>`).join('')}</tbody></table></div></section>`}
function admin(){return `<div class="metrics"><div class="metric"><label>Usuarios ficticios</label><strong>${users.length}</strong><small>Lista de demostración</small></div><div class="metric"><label>Módulos</label><strong>3</strong><small>Permisos independientes</small></div><div class="metric"><label>Gestión de accesos</label><strong style="font-size:21px">Exclusiva</strong><small>Vista de data@maxikash.mx</small></div><div class="metric"><label>Estado</label><strong style="font-size:21px">${dirty?'Sin guardar':'Demo lista'}</strong><small>Solo memoria del navegador</small></div></div><div class="toolbar"><input id="userSearch" aria-label="Buscar usuario ficticio" placeholder="Buscar usuario ficticio…" value="${esc(filter)}"><button class="ghost" id="newUser">＋ Usuario ficticio</button><button class="primary" id="saveUsers">Guardar cambios · demo</button></div><section class="panel table"><div class="tablewrap"><table><thead><tr><th>Usuario ficticio</th><th>Resumen · ver</th><th>Distribuidores · ver</th><th>Cartera · ver</th><th>Cartera · descargar</th></tr></thead><tbody id="userRows">${userRows()}</tbody></table></div></section><div class="notice"><b>Demostración de administración.</b> Puedes cambiar las casillas y guardar para probar el flujo. Los cambios solo viven en esta pestaña y desaparecen al recargar; no se envían a ninguna API. No se muestran los 27 usuarios reales.</div><div class="legend">En el sistema definitivo, únicamente data@maxikash.mx verá este panel. Cada permiso se verificará también en el servidor.</div>`}
function userRows(){const rows=users.map((u,i)=>({u,i})).filter(({u})=>(u.name+' '+u.email).toLowerCase().includes(filter.toLowerCase()));return rows.length?rows.map(({u,i})=>`<tr><td><b>${esc(u.name)}</b><small>${esc(u.email)}</small></td>${['res','dist','cart','download'].map(k=>`<td><input type="checkbox" data-user="${i}" data-key="${k}" aria-label="${k} para ${esc(u.name)}" ${u[k]?'checked':''} ${k==='download'&&!u.cart?'disabled':''}></td>`).join('')}</tr>`).join(''):'<tr><td colspan="5" class="empty">No se encontraron usuarios ficticios.</td></tr>'}
function bindChecks(){document.querySelectorAll('[data-user]').forEach(el=>el.onchange=()=>{const u=users[Number(el.dataset.user)];u[el.dataset.key]=el.checked;if(!u.cart)u.download=false;dirty=true;document.getElementById('userRows').innerHTML=userRows();bindChecks()})}
function wireAdmin(){bindChecks();document.getElementById('userSearch').oninput=e=>{filter=e.target.value;document.getElementById('userRows').innerHTML=userRows();bindChecks()};document.getElementById('saveUsers').onclick=()=>{dirty=false;render();toast('Cambios de ejemplo guardados en esta pestaña. Sin cambios reales.')};document.getElementById('newUser').onclick=()=>{document.getElementById('modal').innerHTML='<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="Nuevo usuario ficticio"><h2>Agregar usuario ficticio</h2><p class="sub">Se creará una dirección de ejemplo, sin acceso real.</p><label for="demoName">Nombre de ejemplo</label><input id="demoName" placeholder="Equipo de ejemplo" maxlength="50"><div class="actions"><button class="ghost" id="cancelNew">Cancelar</button><button class="primary" id="confirmNew">Agregar a la demo</button></div></section></div>';document.getElementById('demoName').focus();document.getElementById('cancelNew').onclick=()=>document.getElementById('modal').innerHTML='';document.getElementById('confirmNew').onclick=()=>{const name=document.getElementById('demoName').value.trim()||'Nuevo usuario de ejemplo';users.push({name,email:'usuario.'+(users.length+1)+'@example.com',res:false,dist:false,cart:false,download:false});dirty=true;document.getElementById('modal').innerHTML='';render();toast('Usuario ficticio agregado; sin acceso real')}}}
login();
</script></body></html>
